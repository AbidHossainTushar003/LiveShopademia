name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production CSS
        run: npm run build:css
      - name: Audit dependency advisories
        run: npm audit --audit-level=low
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Validate Caddy routes
        run: |
          docker run --rm --network none \
            -e STOREFRONT_DOMAIN=shopademia.store \
            -e ADMIN_DOMAIN=admin.shopademia.store \
            -e API_DOMAIN=api.shopademia.store \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build production application image
        run: docker build --pull --tag shopademia:ci .
