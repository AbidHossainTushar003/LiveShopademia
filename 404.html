<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you requested could not be found on Shopademia.">
    <meta name="theme-color" content="#0f172a">
    <title>Page not found | Shopademia</title>
    <link rel="icon" type="image/svg+xml" href="/public-assets/favicon.svg">
    <link rel="stylesheet" href="/css/site-chrome.css">
    <style>
        body { min-height:100vh; margin:0; display:flex; flex-direction:column; color:#0f172a; background:#f8fafc; font:16px/1.6 system-ui,sans-serif; }
        main { flex:1; display:grid; place-items:center; padding:3rem 1.25rem; }
        .not-found { width:min(38rem,100%); border:1px solid #dbeafe; border-radius:2rem; padding:clamp(2rem,7vw,4rem); background:#fff; text-align:center; box-shadow:0 24px 60px #0f172a12; }
        .not-found img { width:4rem; height:4rem; }
        .not-found .code { margin:.8rem 0 0; color:#1d4ed8; font-size:.75rem; font-weight:900; letter-spacing:.16em; }
        .not-found h1 { margin:.3rem 0; font-size:clamp(2rem,7vw,3.5rem); letter-spacing:-.05em; line-height:1.1; }
        .not-found p { color:#475569; }
        .not-found a { display:inline-flex; min-height:2.8rem; align-items:center; justify-content:center; margin-top:.7rem; border-radius:.8rem; padding:.7rem 1.2rem; color:#fff; background:#1d4ed8; font-weight:800; text-decoration:none; }
        .not-found a:hover { background:#1e40af; }
    </style>
</head>
<body>
    <main>
        <section class="not-found">
            <img src="/public-assets/shopademia-mark.svg" alt="Shopademia">
            <p class="code">404 · PAGE NOT FOUND</p>
            <h1>This page took a wrong turn.</h1>
            <p>The page may have moved, or the link may be out of date. Let’s get you back to the shops.</p>
            <a href="/">Explore Shopademia</a>
        </section>
    </main>
    <script type="module" src="/js/site-chrome.js"></script>
</body>
</html>
